name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Build do app web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Adicionar plataforma Android (se ainda não existir)
        run: npx cap add android || npx cap sync android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      # Se o app usa push notifications via Firebase, envie o google-services.json
      # como um secret em Base64 (GOOGLE_SERVICES_JSON) e descomente este passo:
      # - name: Adicionar google-services.json
      #   run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: sifau-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
